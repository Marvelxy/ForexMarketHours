name: CI

# Fast compile check on every push to main and every pull request.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app (native arch)
        run: |
          chmod +x Scripts/*.sh
          make app-native CONFIGURATION=release
          ls -la build/ForexMarketHours.app
